# Single-node Elasticsearch for the exercise.
#
#   docker compose up -d
#   curl http://localhost:9200
#
# Security is disabled so you can connect without TLS/credentials and focus on
# the tool itself. (Your tool should still SUPPORT auth + TLS via config — this
# local node just doesn't require it.)
#
# Tear down with:  docker compose down -v
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    container_name: es-housekeeping-exercise
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
